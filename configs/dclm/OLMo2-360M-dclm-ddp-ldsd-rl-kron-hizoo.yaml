# OLMo2 ~360M (d_model=896, 16 слоёв), Wikipedia, LDSDRlKron, DDP.
#
# LDSDRlKron = «политика» ZO-RL (направления z ~ N(μ, σ²) с обучаемым μ) внутри
# механизма выбора направления KronZO (Алгоритм 2, строки 8–19):
#   * на каждом шаге сэмплируется q проб z_i ~ N(μ, σ²);
#   * для каждой считается SPSA-скаляр c_i = (L(θ+εz_i) − L(θ−εz_i))/2ε и
#     кандидатный шаг L(θ − α c_i z_i);
#   * берётся ОДНО лучшее по падению лосса направление, и шаг принимается только
#     если он бьёт худший из последних h принятых лоссов (скользящее окно);
#   * μ по-прежнему учится ES/score-function градиентом ZO-RL (без изменений),
#     на возвратах f_i = L(θ+εz_i).
#
# Стоимость шага: 1 + 3q forward (two_side). С q=10 → ~31 forward/шаг.
#
# Запуск (2 GPU):
#   uv run torchrun --nproc_per_node=2 scripts/train.py \
#       configs/wiki/OLMo2-360M-dclm-ddp-ldsd-rl-kron-hizoo.yaml

run_name: OLMo2-360M-dclm-ddp-ldsd-rl-kron-hizoo
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: zo-olmo-kronzo
  group: ${run_name}
  entity: andrey

model:
  d_model: 896
  n_heads: 14
  n_layers: 16
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  rope_theta: 500000
  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm: true
  attention_layer_norm_with_affine: true
  norm_after: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 1024
  vocab_size: 100278
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

softmax_auxiliary_loss: true
auxiliary_loss_multiplier: 1e-5
fused_loss: false

compile: null

optimizer:
  name: ldsd_rl_kron
  learning_rate: 1.0e-4
  weight_decay: 0.0
  decay_norm_and_bias: true
  decay_embeddings: false
  metrics_log_interval: 1
  zo_eps: 2.0e-4
  zo_perturbation_mode: two_side
  betas:
    - 0.9
    - 0.999
  # --- LDSDRlKron ---
  ldsd_rl_kron_query_budget: 33     # q: число проб/кандидатов на шаг
  ldsd_rl_kron_history_length: 20   # h: окно приёма шага (KronZO)
  ldsd_rl_kron_apply: kron         # kron | sign_sgd | sgd | adamm
  ldsd_rl_kron_mu_return: candidate # perturbed (как в ZO-RL) | candidate
  ldsd_rl_mu_init: zero             # zero | random  (μ_0)
  ldsd_rl_mu_init_from_fo: false    # true → μ_0 из FO-градиента (перекрывает mu_init)
  ldsd_rl_mu_init_normalize: false
  ldsd_rl_variance: 1.0          # σ распределения N(μ, σ²)
  ldsd_rl_params_ratio: 1.0         # 1.0 = плотный режим (как KronZO); <1 = разреженный ZO-RL
  ldsd_rl_beta: 0.9                 # для apply=sign_sgd
  ldsd_rl_sgd_momentum: 0.9         # для apply=sgd
  # --- HiZOO: диагональный гессиан-префкондиционер (требует apply=kron + two_side) ---
  # Кривизна S=(ℓ₊+ℓ₋−2ℓ)/2ε² бесплатна; шаг вдоль Σ^½⊙z. μ-апдейт (ES) не трогается.
  # Метрики: optim/hessian_mean, optim/precond_sqrt_mean, optim/curvature_abs.
  ldsd_rl_kron_hessian: true
  ldsd_rl_kron_hessian_smooth: 1.0e-6  # α EMA (подними до 1e-4, если Σ не адаптируется)
  ldsd_rl_kron_hessian_min: 1.0e-8

scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 2000000
  t_max: 500000000 
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: tokenizers/allenai_dolma2.json
  truncate_direction: right

save_folder: ./runs/OLMo2-360M-dclm-ddp-ldsd-rl-kron-hizoo
save_overwrite: false

save_interval: 1000
save_interval_ephemeral: 1000
save_num_checkpoints_to_keep: 2
save_interval_unsharded: 1000
save_num_unsharded_checkpoints_to_keep: 2

load_path: null
try_load_latest_save: true

global_train_batch_size: 512
device_train_microbatch_size: 4

max_duration: 500000000T 

precision: amp_bf16

distributed_strategy: ddp

ddp:
  grad_sync_mode: batch
  find_unused_params: false

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_interval: 1000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

evaluators:
  - label: dolma_wiki-validation
    type: lm
    data:
      pad_direction: right
      num_workers: 4
      drop_last: true
      pin_memory: true
      prefetch_factor: 2
      persistent_workers: true
      memmap_dtype: uint32
      paths:
        - /data/users/vtrofimov/OLMo-Zero-Order-Optimization/data/wikitext/validation/0_00000.npy

data:
  pad_direction: right
  num_workers: 8
  drop_last: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  memmap_dtype: uint32
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - /data/users/evgeniystep/huawei/OLMo-Zero-Order-Optimization/data/olmo-mix/train/00000_00000.npy 
    - /data/users/evgeniystep/huawei/OLMo-Zero-Order-Optimization/data/olmo-mix/train/00001_00000.npy 
    - /data/users/evgeniystep/huawei/OLMo-Zero-Order-Optimization/data/olmo-mix/train/00002_00000.npy 
    - /data/users/evgeniystep/huawei/OLMo-Zero-Order-Optimization/data/olmo-mix/train/00003_00000.npy 
    - /data/users/evgeniystep/huawei/OLMo-Zero-Order-Optimization/data/olmo-mix/train/00004_00000.npy 
    - /data/users/evgeniystep/huawei/OLMo-Zero-Order-Optimization/data/olmo-mix/train/00005_00000.npy 
