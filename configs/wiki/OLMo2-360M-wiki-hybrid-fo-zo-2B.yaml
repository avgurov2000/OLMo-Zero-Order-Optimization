# OLMo2 ~360M — 2B-token run with HYBRID FO+ZO training.
#
# Head + embeddings train with first-order AdamW via autograd; everything else
# trains with the main ZO optimizer (zo_adam, n=1 antithetic pair).  Both updates
# happen every step.  Total forward passes per step = 2 (same as plain two-sided ZO).
#
# Why this might help:
#   The LM head + input embeddings together hold ~vocab_size·d_model parameters
#   (here ~90M out of 360M total ≈ 25%), and their gradients are well-defined and
#   highly informative.  Training them with FO captures that signal cheaply; the
#   remaining 270M params still pay only ZO memory cost (no full activation cache).
#
# DDP requirement:
#   The ZO body params have ``requires_grad`` temporarily flipped off around the FO
#   forward+backward, so DDP needs ``find_unused_params=True`` AND
#   ``grad_sync_mode=micro_batch``.  These are set in the `ddp:` block below.
#
# Запуск (2 GPU):
#   uv run torchrun --nproc_per_node=2 scripts/train.py \
#       configs/wiki/OLMo2-360M-wiki-hybrid-fo-zo-2B.yaml

run_name: OLMo2-360M-wiki-hybrid-fo-zo-2B
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: olmo-wiki
  group: ${run_name}
  entity: null

model:
  d_model: 896
  n_heads: 14
  n_layers: 16
  mlp_ratio: 8
  weight_tying: false      # head + embed are two distinct tensors → both routed to FO
  alibi: false
  rope: true
  rope_theta: 500000
  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm: true
  attention_layer_norm_with_affine: true
  norm_after: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 1024
  vocab_size: 100278
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

softmax_auxiliary_loss: true
auxiliary_loss_multiplier: 1e-5
fused_loss: false

compile: null

# ── Main ZO optimizer (body) ─────────────────────────────────────────────────
optimizer:
  name: zo_adam
  learning_rate: 1.0e-4
  weight_decay: 0.1
  eps: 1e-8
  decay_norm_and_bias: true
  decay_embeddings: false
  betas:
    - 0.9
    - 0.95
  metrics_log_interval: 1
  zo_eps: 1.0e-3
  zo_perturbation_mode: two_side
  mezo_vector_sampling_type: standard_normal
  mezo_num_pert_samples: 1    # 1 antithetic pair → 2 forwards/step (hybrid contract)

# ZO scheduler — cosine over full 2B-token horizon.
scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 100000000          # 100M-token warmup for the ZO body
  t_max: 2000000000
  alpha_f: 0.1
  warmup_min_lr: 0.0

# ── Hybrid FO optimizer (head + embeddings) ──────────────────────────────────
hybrid_fo:
  # Defaults match the canonical OLMo names; spelled out for visibility.
  param_patterns:
    - "transformer\\.wte\\.weight"
    - "transformer\\.ff_out\\.weight"
  learning_rate: 4.0e-4         # FO can tolerate a 4× higher LR than ZO
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  t_warmup: 100000000           # 100M-token warmup, in scheduler units
  t_max: 2000000000             # same horizon as ZO scheduler
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: tokenizers/allenai_dolma2.json
  truncate_direction: right

save_folder: ./runs/OLMo2-360M-wiki-hybrid-fo-zo-2B
save_overwrite: false

save_interval: 1000
save_interval_ephemeral: 1000
save_num_checkpoints_to_keep: 2
save_interval_unsharded: 1000
save_num_unsharded_checkpoints_to_keep: 2

load_path: null

global_train_batch_size: 512
device_train_microbatch_size: 4

max_duration: 2000000000T

precision: amp_bf16

distributed_strategy: ddp

# Hybrid mode flips requires_grad on ZO body params during FO backward, so DDP
# must accommodate per-step "unused" parameters.  See HybridFOConfig docstring.
ddp:
  grad_sync_mode: micro_batch
  find_unused_params: true

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_interval: 1000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

evaluators:
  - label: dolma_wiki-validation
    type: lm
    data:
      pad_direction: right
      num_workers: 4
      drop_last: true
      pin_memory: true
      prefetch_factor: 2
      persistent_workers: true
      memmap_dtype: uint32
      paths:
        - /home/gur_andry/data/wikitext/validation/0_00000.npy

data:
  pad_direction: right
  num_workers: 8
  drop_last: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  memmap_dtype: uint32
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - /home/gur_andry/data/olmo-wiki/train/wiki-0001/0_00000.npy
    - /home/gur_andry/data/olmo-wiki/train/wiki-0001/0_00001.npy
    - /home/gur_andry/data/olmo-wiki/train/wiki-0001/0_00002.npy
    - /home/gur_andry/data/olmo-wiki/train/wiki-0000/0_00000.npy
